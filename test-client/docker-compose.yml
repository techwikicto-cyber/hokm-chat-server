# تستر چت سرور هکم
#
#   cp tester.env.example tester.env      و مقادیرش را پر کنید
#
#   docker compose run --rm tester              # عیب‌یابی شبکه + همه تست‌ها
#   docker compose run --rm tester --diagnose   # فقط شبکه
#   docker compose run --rm tester --verbose    # با لاگ کامل پیام‌ها
#   docker compose run --rm tester --json       # خروجی ماشین‌خوان
#   docker compose up ui                        # حالت مرورگر روی :8080
#
# آرگومان‌های بعد از نام سرویس مستقیم به cli.js پاس می‌شوند.

services:
  # ---------------------------------------------------------------
  # حالت خط فرمان — یک‌بار اجرا می‌شود، گزارش می‌دهد و تمام.
  # کد خروجی ۰ یعنی سالم، ۱ یعنی چیزی خراب است (مناسب cron و CI).
  # ---------------------------------------------------------------
  tester:
    build: .
    image: hokm-chat-tester

    # با network_mode: host کانتینر شبکه خود ماشین را می‌بیند، پس اگر سرور چت
    # روی همین ماشین است می‌توانید 127.0.0.1 بدهید. برای سرور ریموت هم فرقی نمی‌کند.
    # روی Docker Desktop (مک/ویندوز) این گزینه پشتیبانی نمی‌شود — آن را کامنت کنید
    # و به‌جای 127.0.0.1 از host.docker.internal استفاده کنید.
    network_mode: host

    # تنظیمات مستقیم از فایل خوانده می‌شود، نه با ${...}. این عمدی است:
    # کامپوز داخل مقدارهایی که interpolate می‌کند دنبال متغیر می‌گردد و
    # کلید AES که به «$C» ختم می‌شود خراب می‌شد.
    env_file:
      - tester.env

  # ---------------------------------------------------------------
  # حالت مرورگر — دو کلاینت زنده کنار هم برای تست دستی.
  # این کانتینر خودش به سرور چت وصل نمی‌شود؛ اتصال سوکت از مرورگر شما
  # برقرار می‌شود. پس شبکه bridge کافی است.
  # ---------------------------------------------------------------
  ui:
    build: .
    image: hokm-chat-tester
    entrypoint: ["node", "server.js"]
    ports:
      - "8080:8080"
    restart: unless-stopped
